<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Strikeclub Velten · Spielplan</title>
  <meta name="description" content="Spielplan der Bowlingliga mit Terminen, Gegnern und Bahnpaarungen.">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <main class="shell schedule-public-shell">
    <div class="topbar">
      <div class="brand">Strikeclub Velten · Spielplan</div>
      <div class="actions">
        <a id="resultsLink" class="button secondary" href="/ergebnisse.html">Ergebnisse</a>
        <a class="button secondary" href="/archiv.html">Archiv</a>
        <a class="button secondary" href="/">Startseite</a>
      </div>
    </div>

    <section class="panel schedule-hero">
      <div>
        <div class="badge">Saisonübersicht</div>
        <h1 id="scheduleTitle">Spielplan wird geladen</h1>
        <p id="scheduleSummary" class="muted">Termine, Gegner und Bahnpaarungen für alle 14 Spieltage.</p>
      </div>
      <div class="lane-legend">
        <span>Bahn 1+2</span><span>Bahn 3+4</span><span>Bahn 5+6</span><span>Bahn 7+8</span>
      </div>
    </section>

    <div id="scheduleMessage" class="status hidden"></div>
    <div id="publicSchedule" class="public-schedule-grid"></div>
  </main>
  <script type="module" src="/js/schedule.js"></script>
</body>
</html>
